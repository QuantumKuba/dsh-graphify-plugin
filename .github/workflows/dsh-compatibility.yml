name: DeepSeek Harness & Upstream Compatibility

on:
  schedule:
    # Run every Tuesday at 05:30 UTC
    - cron: '30 5 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dsh-compatibility:
    name: Test with DSH (${{ matrix.dsh_channel }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dsh_channel: [next, alpha]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: pnpm
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Upgrade to DSH ${{ matrix.dsh_channel }} packages
        run: |
          pnpm add @deepseek-ai/schemastery@latest
          pnpm add -D \
            @deepseek-ai/cordis@latest \
            @deepseek-ai/dsh-client-locale@${{ matrix.dsh_channel }} \
            @deepseek-ai/dsh-client-ui-chat@${{ matrix.dsh_channel }} \
            @deepseek-ai/dsh-client-ui-conversation@${{ matrix.dsh_channel }} \
            @deepseek-ai/dsh-client-ui-primitives@${{ matrix.dsh_channel }} \
            @deepseek-ai/dsh-client-ui-renderer@${{ matrix.dsh_channel }} \
            @deepseek-ai/dsh-client-ui-slots@${{ matrix.dsh_channel }} \
            @deepseek-ai/dsh-commands@${{ matrix.dsh_channel }} \
            @deepseek-ai/dsh-session@${{ matrix.dsh_channel }} \
            @deepseek-ai/dsh-tools@${{ matrix.dsh_channel }} \
            @deepseek-ai/dsh-util-values@${{ matrix.dsh_channel }}
      - name: Report tested versions
        run: |
          pnpm list @deepseek-ai/cordis @deepseek-ai/dsh-session @deepseek-ai/dsh-commands @deepseek-ai/dsh-client-ui-conversation @deepseek-ai/dsh-client-ui-chat @deepseek-ai/dsh-client-ui-renderer --depth 0
      - name: Typecheck
        run: pnpm run typecheck
      - name: Build
        run: pnpm run build
      - name: Run unit & integration tests
        run: pnpm test
      - name: Run schema drift detection
        run: pnpm run test:drift

  graphify-edge:
    name: Test against live upstream Graphify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
      - name: Install latest Graphify MCP server
        run: uv tool install 'graphifyy[mcp]'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Run schema drift check against live Graphify
        run: pnpm run test:drift
      - name: Run E2E contract tests
        run: GRAPHIFY_E2E=1 pnpm run test:e2e
